<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的导航 · 美好的一天从这里开始</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- 头部 -->
    <header class="header">
        <div class="header-inner">
            <h1 class="site-title">
                <i class="fas fa-sun" style="color: #fbbf24; margin-right: 10px;"></i>
                美好的一天从这里开始
            </h1>
            <p class="site-subtitle">✨ 收藏你喜爱的网站 · 一键直达</p>
        </div>
    </header>

    <!-- 搜索引擎区域 -->
    <section class="search-section">
        <div class="search-container">

            <!-- 百度 -->
            <div class="search-box">
                <div class="search-brand">
                    <img src="https://www.baidu.com/favicon.ico" alt="百度" class="brand-icon" />
                    <span class="brand-name">百度</span>
                </div>
                <div class="search-input-group">
                    <input type="text" id="baiduInput" placeholder="输入关键词..." class="search-input" />
                    <button id="baiduBtn" class="search-btn baidu-btn">
                        <i class="fas fa-search"></i> 搜一下
                    </button>
                </div>
            </div>

            <!-- Google -->
            <div class="search-box">
                <div class="search-brand">
                    <img src="https://www.google.com/favicon.ico" alt="Google" class="brand-icon" />
                    <span class="brand-name">Google</span>
                </div>
                <div class="search-input-group">
                    <input type="text" id="googleInput" placeholder="输入关键词..." class="search-input" />
                    <button id="googleBtn" class="search-btn google-btn">
                        <i class="fas fa-search"></i> 搜一下
                    </button>
                </div>
            </div>

        </div>
    </section>

    <!-- 分类导航区域 -->
    <main class="main-content">
        <div id="categoriesContainer">
            <!-- 由 JavaScript 动态渲染 -->
        </div>
    </main>

    <!-- 底部 -->
    <footer class="footer">
        <p>© 2026 · 自定义导航 · 数据保存在本地浏览器</p>
    </footer>

    <!-- 模态框：添加 / 编辑网站 -->
    <div id="siteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-pen"></i> 编辑网站</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <form id="siteForm">
                    <input type="hidden" id="editCategoryId" />
                    <input type="hidden" id="editSiteId" />

                    <div class="form-group">
                        <label for="siteName">网站名称 <span class="required">*</span></label>
                        <input type="text" id="siteName" placeholder="例如：百度" required />
                    </div>

                    <div class="form-group">
                        <label for="siteUrl">网址 <span class="required">*</span></label>
                        <input type="url" id="siteUrl" placeholder="https://www.baidu.com" required />
                    </div>

                    <div class="form-group">
                        <label for="siteIcon">图标（可选）</label>
                        <div class="icon-input-hint">
                            <input type="text" id="siteIcon" placeholder="留空自动获取 favicon，或输入 emoji / 文字" />
                            <span class="hint-text"><i class="fas fa-info-circle"></i> 例如：🔥 或 百</span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="modalCancel">取消</button>
                        <button type="submit" class="btn btn-primary" id="modalSubmit">
                            <i class="fas fa-save"></i> 保存
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="deleteModal" class="modal">
        <div class="modal-content" style="max-width: 420px;">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i> 确认删除</h3>
                <button class="modal-close" id="deleteModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <p id="deleteConfirmMsg">确定要删除该网站吗？</p>
                <div class="form-actions" style="justify-content: center; gap: 16px;">
                    <button type="button" class="btn btn-secondary" id="deleteCancel">取消</button>
                    <button type="button" class="btn btn-danger" id="deleteConfirm">
                        <i class="fas fa-trash"></i> 删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 主逻辑 -->
    <script src="js/main.js"></script>
</body>
</html>
