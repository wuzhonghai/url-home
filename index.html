<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网址之家 - 精选实用网址导航</title>
    <meta name="description" content="网址之家——精选实用网址导航，助你高效上网。收录搜索引擎、社交、视频、购物、学习、开发等各类优质网站。">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-inner">
            <a href="#" class="logo" aria-label="网址之家首页">
                <span class="logo-icon">🏠</span>
                <span class="logo-text">网址之家</span>
            </a>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换明暗主题">
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
                <button class="btn-add" id="btnAddSite" aria-label="添加网址">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    <span>添加网址</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
        <!-- 搜索区域 -->
        <section class="hero">
            <div class="hero-inner">
                <h1 class="hero-title">发现优质网站，从这里开始</h1>
                <p class="hero-subtitle">精选实用网址导航，涵盖学习、工作、娱乐等各个领域</p>
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="搜索网址名称或描述..." autocomplete="off">
                    <button class="search-clear" id="searchClear" aria-label="清空搜索" style="display:none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- 分类导航 -->
        <nav class="categories" id="categoriesNav" aria-label="网址分类">
            <!-- 由 JS 动态生成 -->
        </nav>

        <!-- 网址卡片网格 -->
        <section class="sites-section">
            <div class="section-header">
                <h2 id="currentCategoryTitle">全部网址</h2>
                <span class="site-count" id="siteCount"></span>
            </div>
            <div class="sites-grid" id="sitesGrid">
                <!-- 由 JS 动态生成 -->
            </div>
            <div class="empty-state" id="emptyState" style="display:none;">
                <div class="empty-icon">🔍</div>
                <h3>未找到相关网址</h3>
                <p>试试其他关键词，或添加一个新的网址</p>
                <button class="btn-primary" id="btnEmptyAdd">添加网址</button>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <p>© <span id="year"></span> 网址之家 · 精选实用网址导航</p>
        <p class="footer-tip">💡 提示：你可以点击右上角「添加网址」来收藏自己喜欢的网站</p>
    </footer>

    <!-- 添加/编辑网址模态框 -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal" role="dialog" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h3 id="modalTitle">添加网址</h3>
                <button class="modal-close" id="modalClose" aria-label="关闭">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <form id="siteForm" class="modal-form">
                <input type="hidden" id="editIndex" value="-1">
                <div class="form-group">
                    <label for="siteName">网站名称 <span class="required">*</span></label>
                    <input type="text" id="siteName" placeholder="例如：GitHub" required maxlength="30">
                </div>
                <div class="form-group">
                    <label for="siteUrl">网站地址 <span class="required">*</span></label>
                    <input type="url" id="siteUrl" placeholder="例如：https://github.com" required>
                </div>
                <div class="form-group">
                    <label for="siteCategory">分类</label>
                    <select id="siteCategory">
                        <!-- 由 JS 动态生成 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="siteDesc">描述（可选）</label>
                    <input type="text" id="siteDesc" placeholder="简短描述这个网站..." maxlength="60">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btnCancel">取消</button>
                    <button type="submit" class="btn-primary" id="btnSubmit">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 确认删除对话框 -->
    <div class="modal-overlay" id="deleteOverlay" style="display:none;">
        <div class="modal modal-small" role="dialog" aria-labelledby="deleteTitle">
            <div class="modal-header">
                <h3 id="deleteTitle">确认删除</h3>
                <button class="modal-close" id="deleteClose" aria-label="关闭">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p>确定要删除「<strong id="deleteSiteName"></strong>」吗？</p>
                <p class="text-muted">此操作无法撤销</p>
            </div>
            <div class="form-actions">
                <button type="button" class="btn-secondary" id="btnDeleteCancel">取消</button>
                <button type="button" class="btn-danger" id="btnDeleteConfirm">删除</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast" style="display:none;"></div>

    <script src="js/main.js"></script>
</body>
</html>
